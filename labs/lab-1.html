<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота №1 — Форма реєстрації</title>
  <link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body>

  <header>
    <h1>Лабораторна робота №1: Основи HTML</h1>
    <nav>
      <a href="../index.html">&larr; Повернутися на головну сторінку</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Форма реєстрації нового користувача</h2>
      <p>Заповніть усі обов'язкові поля форми для реєстрації облікового запису.</p>


      <form action="https://webhook.site/c9f0664a-910b-478a-885b-8540988c6765" method="POST" class="registration-form">
        
        <div class="form-group">
          <label for="first-name">Ім'я <span class="required">*</span></label>
          <input type="text" id="first-name" name="first_name" placeholder="Введіть ваше ім'я" required>
        </div>

        <div class="form-group">
          <label for="last-name">Прізвище <span class="required">*</span></label>
          <input type="text" id="last-name" name="last_name" placeholder="Введіть ваше прізвище" required>
        </div>

        <div class="form-group">
          <label for="email">Адреса електронної пошти <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="example@domain.com" required>
        </div>

        <div class="form-group">
          <label for="password">Пароль <span class="required">*</span></label>
          <input type="password" id="password" name="password" minlength="8" placeholder="Мінімум 8 символів" required>
        </div>

        <div class="form-group">
          <label for="confirm-password">Підтвердження паролю <span class="required">*</span></label>
          <input type="password" id="confirm-password" name="confirm_password" minlength="8" placeholder="Повторіть пароль" required>
        </div>

        <div class="form-group">
          <label for="birthdate">Дата народження</label>
          <input type="date" id="birthdate" name="birthdate">
        </div>

        <div class="form-group">
          <label for="gender">Стать</label>
          <select id="gender" name="gender">
            <option value="">-- Оберіть стать --</option>
            <option value="male">Чоловіча</option>
            <option value="female">Жіноча</option>
            <option value="other">Інше</option>
          </select>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" name="agree_terms" required>
            Погоджуюся з правилами та умовами конфіденційності <span class="required">*</span>
          </label>
        </div>

        <div class="form-actions">
          <input type="submit" value="Зареєструватися">
          <input type="reset" value="Очистити форму">
        </div>

      </form>
    </section>
  </main>

  <footer>
    <p><a href="../index.html">&larr; Повернутися до списку робіт</a></p>
    <p>&copy; 2026 Іван Баранов</p>
  </footer>

</body>
</html>
